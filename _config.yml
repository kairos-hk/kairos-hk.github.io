# Welcome to Jekyll!
#
# This config file is meant for settings that affect your whole blog, values
# which you are expected to set up once and rarely need to edit after that.
# For technical reasons, this file is *NOT* reloaded automatically when you use
# 'jekyll serve'. If you change this file, please restart the server process.

# Site settings
title: Dongyoung Kim
email: dongyoung0912@kaist.ac.kr
description: >-
  Dongyoung Kim, KAIST undergraduate and founder of PatchOne Industries.
  Research in AI security, digital forensics, and embedded post-quantum cryptography.

baseurl: ""
url: "https://kairos.hk"

exclude:
  - README.md
  - design-qa.md
  - Gemfile
  - Gemfile.lock
  - CODE_OF_CONDUCT.md
  - 김동영_cv.pdf

include:
  - .htaccess
  - _pages

sass:
  sass_dir: _sass

# Conversion
markdown: kramdown
highlighter: rouge
lsi: false
excerpt_separator: "\n\n"
incremental: false

# Markdown Processing
kramdown:
  input: GFM
  hard_wrap: false
  auto_ids: true
  footnote_nr: 1
  entity_output: as_char
  toc_levels: 1..6
  smart_quotes: lsquo,rsquo,ldquo,rdquo
  enable_coderay: false
  parse_block_html: true # default for kramdown is false. This will enable using Markdown links

